<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حظيرتي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3f7d3a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef2e6;--card:#fff;--ink:#1f2d1c;--mut:#6a7a62;--pri:#3f7d3a;--acc:#c58a2b;--line:#d6dcc8;--warn:#b3402e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12170f;--card:#1b2318;--ink:#e8eddc;--mut:#9aa98f;--pri:#7bb36f;--acc:#d9a447;--line:#2c3727;--warn:#e0705c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12170f;--card:#1b2318;--ink:#e8eddc;--mut:#9aa98f;--pri:#7bb36f;--acc:#d9a447;--line:#2c3727;--warn:#e0705c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select{-webkit-user-select:text;user-select:text}
.plus{width:36px;height:36px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:24px;line-height:1;padding:0;cursor:pointer;flex:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:14px 18px 8px;display:flex;align-items:baseline;justify-content:space-between}
header h1{margin:0;font-size:26px;color:var(--pri)}
header small{color:var(--mut)}
#main{flex:1;overflow-y:auto;padding:4px 14px 90px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 2px 8px;font:inherit;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:22px;font-weight:400}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:15px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mut)}
.stats b{display:block;font-size:24px;color:var(--pri)}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block}
.row .t span{font-size:13px;color:var(--mut)}
.av{border-radius:50%;object-fit:cover;background:var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--ink);margin-inline-end:4px}
.tag.g{background:var(--pri);color:#fff}.tag.a{background:var(--acc);color:#fff}.tag.w{background:var(--warn);color:#fff}
.btn{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:700;background:var(--pri);color:#fff;cursor:pointer}
.btn.s{background:var(--line);color:var(--ink)}.btn.d{background:var(--warn)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.bar .btn{flex:1}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 14px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.fab{position:fixed;inset-inline-start:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;box-shadow:0 4px 14px #0004;cursor:pointer}
.sh{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}
.sh.open{display:flex}
.sb{background:var(--card);width:100%;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sb h3{margin:0 0 6px;font-size:20px}
.ph{display:flex;justify-content:center;margin:8px 0;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv span:first-child{color:var(--mut)}
.ok{opacity:.5;text-decoration:line-through}
table{width:100%;border-collapse:collapse;margin:8px 0;text-align:center}th,td{border:1px solid var(--line);padding:6px;font-size:15px}th{color:var(--mut);font-weight:400;font-size:12px}
</style>
</head>
<body>
<header><h1>🐇 حظيرتي</h1><small id="dt"></small></header>
<div id="main"></div>
<nav>
<button data-t="today" onclick="go('today')"><b>🏠</b>اليوم</button>
<button data-t="animals" onclick="go('animals')"><b>🐑</b>الحيوانات</button>
<button data-t="breed" onclick="go('breed')"><b>🍼</b>التكاثر</button>
<button data-t="feed" onclick="go('feed')"><b>🌾</b>التغذية</button>
<button data-t="more" onclick="go('more')"><b>☰</b>المزيد</button>
</nav>
<div class="sh" id="sh" onclick="if(event.target===this)cl()"><div class="sb" id="sb"></div></div>
<script>
const $=s=>document.querySelector(s);
let db=null;
try{db=JSON.parse(localStorage.getItem('hazira'))}catch(e){}
db=db||{animals:[],matings:[],births:[],feeds:[]};
const save=()=>{try{localStorage.setItem('hazira',JSON.stringify(db))}catch(e){alert('مساحة التخزين ممتلئة. انسخ بياناتك احتياطياً واحذف بعض الصور.')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>{d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const D=s=>new Date(s+'T00:00');
const addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffD=(a,b)=>Math.round((D(a)-D(b))/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T={rabbit:['أرنب','🐇',31],sheep:['خروف','🐑',150],other:['آخر','🐾',0]};
const ST={active:'نشط',sold:'مباع',dead:'متوفى'};
let tab='today',fl='all',q='',af_='all',tp='',pre={},last=ymd();

function age(s){const a=D(s),b=new Date();let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}const p=[];if(y)p.push(y+' سنة');if(m)p.push(m+' شهر');if(d||!p.length)p.push(d+' يوم');return p.join(' و ')}
const st=a=>a.status||'active';
const act=()=>db.animals.filter(a=>st(a)==='active');
const by=id=>db.animals.find(a=>a.id===id);
const nm=id=>id?(by(id)?by(id).name:'محذوف'):'غير معروف';
const av=(a,s)=>a.photo?`<img class="av" src="${a.photo}" style="width:${s}px;height:${s}px">`:`<div class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s/2)}px">${T[a.type][1]}</div>`;
const litters=id=>db.births.filter(b=>b.mother===id||b.father===id).sort((a,b)=>a.date<b.date?-1:1);
const ln=b=>db.births.filter(x=>x.mother===b.mother).sort((p,r)=>p.date<r.date?-1:1).indexOf(b)+1;
const sum=a=>{if(a.sex!=='f')return'';const l=db.births.filter(b=>b.mother===a.id);if(!l.length)return'';const bn=l.reduce((s,b)=>s+(+b.born||0),0),sv=l.reduce((s,b)=>s+(+b.survived||0),0);return `${T[a.type][1]} ولادات ${l.length} · مواليد ${bn} · ماتوا ${bn-sv}`};

function go(t){tab=t;render()}
function sh(h){$('#sb').innerHTML=h;$('#sh').classList.add('open')}
function cl(){$('#sh').classList.remove('open');$('#sb').innerHTML=''}
function note(m,b){sh(`<h3>${m}</h3>${b||''}<div class="bar"><button class="btn" onclick="cl()">حسناً</button></div>`)}
function ask(m,cb){sh(`<h3>${m}</h3><div class="bar"><button class="btn d" id="yes">نعم</button><button class="btn s" onclick="cl()">لا</button></div>`);$('#yes').onclick=()=>{cl();cb()}}
window.alert=m=>note(m);
function render(){
  $('#dt').textContent=new Date().toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'});
  $('#main').innerHTML=({today:vToday,animals:vAnimals,breed:vBreed,feed:vFeed,more:vMore})[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}
const fab=f=>`<button class="fab" onclick="${f}" aria-label="إضافة">+</button>`;
const empty=t=>`<div class="empty">${t}</div>`;
function arow(a){return `<div class="row" onclick="dt('${a.id}')">${av(a,52)}<div class="t"><b>${esc(a.name)} ${a.star?'⭐':''}</b><span>${a.sex==='f'?'أنثى':'ذكر'} · ${age(a.birth)}${a.breed?' · '+esc(a.breed):''}</span>${sum(a)?`<br><span class="tag g">${sum(a)}</span>`:''}${a.mother||a.father?`<br><span class="tag">👩 الأم: ${esc(nm(a.mother))} · 👨 الأب: ${esc(nm(a.father))}</span>`:''}</div>${st(a)!=='active'?`<span class="tag ${st(a)==='sold'?'a':'w'}">${ST[st(a)]}</span>`:''}</div>`}

function pend(){return db.matings.filter(m=>{const a=by(m.mother);if(!a||st(a)!=='active'||!T[a.type][2])return false;return !db.births.some(b=>b.mother===m.mother&&b.date>=m.date)}).map(m=>({m,due:addD(m.date,T[by(m.mother).type][2])})).sort((a,b)=>a.due<b.due?-1:1)}

function vToday(){
  const A=act(),mo=ymd().slice(0,7),nb=db.births.filter(b=>b.date.slice(0,7)===mo).reduce((s,b)=>s+(+b.born||0),0);
  const td=ymd(),nowT=pad(new Date().getHours())+':'+pad(new Date().getMinutes());
  const fs=db.feeds.slice().sort((a,b)=>a.time<b.time?-1:1);
  const P=pend();
  return `<div class="stats"><div><b>${A.length}</b>حيوان</div><div><b>${A.filter(a=>a.sex==='f').length}</b>إناث</div><div><b>${A.filter(a=>a.sex==='m').length}</b>ذكور</div><div><b>${nb}</b>مواليد الشهر</div></div>
  <div class="card"><h3>مهام التغذية اليوم<button class="plus" onclick="ff()" aria-label="إضافة">+</button></h3>${fs.length?fs.map(f=>{const done=(f.done||{})[td];const late=!done&&f.time<=nowT;return `<div class="row" onclick="tf('${f.id}')"><div style="font-size:24px">${done?'✅':late?'⏰':'⬜'}</div><div class="t ${done?'ok':''}"><b>${f.time} · ${esc(f.feed)}</b><span>${f.target==='all'?'كل الحيوانات':T[f.target][0]}${f.qty?' · '+esc(f.qty):''}</span></div>${late?'<span class="tag w">حان الموعد</span>':''}</div>`}).join(''):empty('لا توجد مواعيد تغذية. أضفها من تبويب التغذية.')}</div>
  <div class="card"><h3>ولادات متوقعة<button class="plus" onclick="mf()" aria-label="إضافة">+</button></h3>${P.length?P.map(({m,due})=>{const n=diffD(due,td);return `<div class="row" onclick="dt('${m.mother}')"><div style="font-size:24px">🍼</div><div class="t"><b>${esc(nm(m.mother))}</b><span>الأب: ${esc(nm(m.father))} · المتوقع ${due}</span></div><span class="tag ${n<=3?'w':'g'}">${n<0?'متأخرة '+(-n)+' يوم':n===0?'اليوم':'بعد '+n+' يوم'}</span></div>`}).join(''):empty('لا توجد تزاوجات قيد الانتظار.')}</div>`
}

function vAnimals(){
  let L=act().filter(a=>(fl==='all'||(fl==='star'?a.star:fl==='f'||fl==='m'?a.sex===fl:a.type===fl))&&a.name.includes(q));
  const c=(k,t)=>`<button class="${fl===k?'on':''}" onclick="fl='${k}';render()">${t}</button>`;
  return `<input placeholder="ابحث بالاسم أو الرقم" value="${esc(q)}" oninput="q=this.value;rl()" style="margin-top:8px">
  <div class="chips">${c('all','الكل')}${c('rabbit','🐇 أرانب')}${c('sheep','🐑 أغنام')}${c('f','إناث')}${c('m','ذكور')}${c('star','⭐ مميزة')}</div>
  <div class="card" id="al">${L.length?L.map(arow).join(''):empty(act().length?'لا نتائج.':'ما أضفت أي حيوان بعد. اضغط + لإضافة أول حيوان.')}</div>${fab('af()')}`
}
function rl(){const L=act().filter(a=>(fl==='all'||(fl==='star'?a.star:fl==='f'||fl==='m'?a.sex===fl:a.type===fl))&&a.name.includes(q));$('#al').innerHTML=L.length?L.map(arow).join(''):empty('لا نتائج.')}

function vBreed(){
  const B=db.births.slice().sort((a,b)=>a.date<b.date?1:-1),P=pend();
  return `<div class="bar"><button class="btn" onclick="mf()">💞 أنثى حامل / تزاوج</button><button class="btn s" onclick="bf()">🍼 تسجيل ولادة</button></div>
  <div class="card"><h3>بانتظار الولادة<button class="plus" onclick="mf()" aria-label="إضافة">+</button></h3>${P.length?P.map(({m,due})=>`<div class="row"><div class="t"><b>${esc(nm(m.mother))} × ${esc(nm(m.father))}</b><span>تزاوج ${m.date} · المتوقع ${due}</span></div><button class="btn s" onclick="dm('${m.id}')">حذف</button></div>`).join(''):empty('لا يوجد.')}</div>
  <div class="card"><h3>سجل الأجيال<button class="plus" onclick="bf()" aria-label="إضافة">+</button></h3>${B.length?B.map(b=>`<div class="row" onclick="dt('${b.mother}')"><div style="font-size:26px">🍼</div><div class="t"><b>${esc(nm(b.mother))} · الجيل ${ln(b)}</b><span>الأب: ${esc(nm(b.father))} · وُلدوا ${b.date} · عمر الجيل ${age(b.date)}</span></div><span class="tag g">${b.born} وُلدوا · ${b.born-b.survived} ماتوا</span></div>`).join(''):empty('لا توجد ولادات مسجلة.')}</div>`
}

function vFeed(){
  return `<div class="card"><h3>جدول التغذية اليومي<button class="plus" onclick="ff()" aria-label="إضافة">+</button></h3>${db.feeds.length?db.feeds.slice().sort((a,b)=>a.time<b.time?-1:1).map(f=>`<div class="row"><div class="t"><b>${f.time} · ${esc(f.feed)}</b><span>${f.target==='all'?'كل الحيوانات':T[f.target][0]}${f.qty?' · '+esc(f.qty):''}</span></div><button class="btn s" onclick="df('${f.id}')">حذف</button></div>`).join(''):empty('أضف أول موعد إطعام بالزر +')}</div>${fab('ff()')}`
}

function vMore(){
  const R=db.animals.filter(a=>st(a)!=='active').filter(a=>af_==='all'||st(a)===af_);
  const c=(k,t)=>`<button class="${af_===k?'on':''}" onclick="af_='${k}';render()">${t}</button>`;
  const ns=db.animals.filter(a=>st(a)==='sold').length,nd=db.animals.filter(a=>st(a)==='dead').length;
  return `<div class="card"><h3>الأرشيف: المباع والمتوفى</h3><div class="stats" style="grid-template-columns:1fr 1fr"><div><b>${ns}</b>مباع</div><div><b>${nd}</b>متوفى</div></div>
  <div class="chips">${c('all','الكل')}${c('sold','💰 مباع')}${c('dead','متوفى')}</div>
  ${R.length?R.map(a=>`<div class="row" onclick="dt('${a.id}')">${av(a,46)}<div class="t"><b>${esc(a.name)}</b><span>${ST[st(a)]} · ${a.sdate||''}${a.snote?' · '+esc(a.snote):''}</span></div></div>`).join(''):empty('الأرشيف فارغ.')}</div>
  <div class="card"><h3>نسخة احتياطية</h3><p style="font-size:14px;color:var(--mut);margin:0 0 8px">بياناتك محفوظة على هذا الجهاز فقط. انسخ النص وخزّنه في مكان آمن، ولصقه لاحقاً لاسترجاع كل شيء.</p><div class="bar"><button class="btn" onclick="ex()">نسخ البيانات</button><button class="btn s" onclick="im()">استرجاع</button></div></div>`
}

/* حيوان */
function pp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,320/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);tp=c.toDataURL('image/jpeg',.72);$('#pv').outerHTML=`<img id="pv" class="av" src="${tp}" style="width:96px;height:96px">`};i.src=r.result};r.readAsDataURL(f)}
function af(id,p){
  const a=id?by(id):Object.assign({type:'rabbit',sex:'f',birth:ymd()},p||{});pre=a;tp=a.photo||'';
  const o=(k,v,cur)=>`<option value="${k}" ${cur===k?'selected':''}>${v}</option>`;
  sh(`<h3>${id?'تعديل الحيوان':'حيوان جديد'}</h3><form onsubmit="return sa(event,'${id||''}')">
  <div class="ph" onclick="$('#pf').click()">${tp?`<img id="pv" class="av" src="${tp}" style="width:96px;height:96px">`:`<div id="pv" class="av" style="width:96px;height:96px;font-size:40px">📷</div>`}</div>
  <input type="file" id="pf" accept="image/*" hidden onchange="pp(this)">
  <div style="text-align:center;font-size:13px;color:var(--mut)">اضغط على الصورة للتصوير أو الاختيار من المعرض</div>
  <label>الاسم أو الرقم</label><input name="name" required value="${esc(a.name)}">
  <div class="two"><div><label>النوع</label><select name="type">${Object.keys(T).map(k=>o(k,T[k][1]+' '+T[k][0],a.type)).join('')}</select></div>
  <div><label>الجنس</label><select name="sex">${o('f','أنثى',a.sex)}${o('m','ذكر',a.sex)}</select></div></div>
  <label>تاريخ الميلاد</label><input type="date" name="birth" required value="${a.birth}">
  <div class="two"><div><label>👩 الأم</label><select name="mother">${po('f',a.mother)}</select></div><div><label>👨 الأب</label><select name="father">${po('m',a.father)}</select></div></div>
  <label>السلالة</label><input name="breed" value="${esc(a.breed)}">
  <label>ملاحظات</label><textarea name="notes" rows="2">${esc(a.notes)}</textarea>
  <label style="display:flex;gap:10px;align-items:center;color:var(--ink)"><input type="checkbox" name="star" style="width:auto" ${a.star?'checked':''}> ⭐ حيوان مميز للتربية (لا يُباع)</label>
  <div class="bar"><button class="btn">حفظ</button><button type="button" class="btn s" onclick="cl()">إلغاء</button></div>
  ${id?`<button type="button" class="btn d" style="width:100%" onclick="da('${id}')">حذف نهائي</button>`:''}</form>`)
}
function sa(e,id){e.preventDefault();const f=new FormData(e.target),o={name:f.get('name').trim(),type:f.get('type'),sex:f.get('sex'),birth:f.get('birth'),breed:f.get('breed'),notes:f.get('notes'),mother:f.get('mother')||'',father:f.get('father')||'',star:f.get('star')==='on',photo:tp};
  if(id){Object.assign(by(id),o)}else{db.animals.push(Object.assign({id:uid(),status:'active',mother:pre.mother,father:pre.father,litter:pre.litter},o))}
  save();cl();render();return false}
function da(id){ask('حذف هذا الحيوان نهائياً مع كل بياناته؟',()=>{db.animals=db.animals.filter(a=>a.id!==id);save();render()})}

function dt(id){
  const a=by(id);if(!a)return;const L=litters(id);
  sh(`<div style="text-align:center">${av(a,110)}<h3 style="margin-top:8px">${esc(a.name)} ${a.star?'⭐':''}</h3>
  <span class="tag">${T[a.type][1]} ${T[a.type][0]}</span><span class="tag">${a.sex==='f'?'أنثى':'ذكر'}</span>${st(a)!=='active'?`<span class="tag ${st(a)==='sold'?'a':'w'}">${ST[st(a)]}</span>`:''}${sum(a)?`<br><span class="tag g" style="margin-top:6px">${sum(a)}</span>`:''}</div>
  <div style="margin-top:10px"><div class="kv"><span>العمر</span><span>${age(a.birth)}</span></div><div class="kv"><span>تاريخ الميلاد</span><span>${a.birth}</span></div>
  ${a.breed?`<div class="kv"><span>السلالة</span><span>${esc(a.breed)}</span></div>`:''}
  ${a.mother||a.father?`<div class="kv"><span>الأم / الأب</span><span>${esc(nm(a.mother))} / ${esc(nm(a.father))}</span></div>`:''}
  ${st(a)!=='active'?`<div class="kv"><span>${ST[st(a)]} بتاريخ</span><span>${a.sdate||''}</span></div>${a.snote?`<div class="kv"><span>ملاحظة</span><span>${esc(a.snote)}</span></div>`:''}`:''}
  ${a.notes?`<div class="kv"><span>ملاحظات</span><span>${esc(a.notes)}</span></div>`:''}</div>
  ${L.length?`<h3 style="margin-top:16px;font-size:16px">سجل الأجيال</h3>`+L.map(b=>{const K=db.animals.filter(k=>k.litter===b.id);return `<div class="card" style="margin:8px 0"><b>الجيل ${ln(b)}</b> <span style="font-size:13px;color:var(--mut)">· عمر الجيل ${age(b.date)} · ${a.sex==='m'?'الأم: '+esc(nm(b.mother)):'الأب: '+esc(nm(b.father))}</span><table><tr><th>تاريخ الولادة</th><th>وُلدوا</th><th>أحياء</th><th>ماتوا</th></tr><tr><td>${b.date}</td><td>${b.born}</td><td>${b.survived}</td><td>${b.born-b.survived}</td></tr></table><button class="btn s" style="width:100%;margin-bottom:6px" onclick="ef('${b.id}')">تعديل الجيل / تسجيل وفاة</button>
  ${K.map(k=>`<div class="row" onclick="dt('${k.id}')">${av(k,36)}<div class="t"><b>${esc(k.name)} ${k.star?'⭐':''}</b><span>${age(k.birth)}${st(k)!=='active'?' · '+ST[st(k)]:''}</span></div><button class="plus" style="background:var(--warn);width:32px;height:32px;font-size:16px" onclick="event.stopPropagation();da('${k.id}')" aria-label="حذف">✕</button></div>`).join('')}
  <button class="btn s" style="margin-top:6px;width:100%" onclick="af('',{mother:'${b.mother}',father:'${b.father||''}',litter:'${b.id}',birth:'${b.date}',type:'${by(b.mother)?by(b.mother).type:'rabbit'}',sex:'f'})">+ إضافة فرد من هذا الجيل</button></div>`}).join(''):''}
  <div class="bar" style="margin-top:14px"><button class="btn" onclick="af('${id}')">تعديل</button><button class="btn s" onclick="sf('${id}')">تحديث الحالة</button><button class="btn d" onclick="da('${id}')">🗑️ حذف</button></div>`)
}
function sf(id){const a=by(id);
  sh(`<h3>حالة ${esc(a.name)}</h3><form onsubmit="return ss(event,'${id}')"><label>الحالة</label><select name="s">${Object.keys(ST).map(k=>`<option value="${k}" ${st(a)===k?'selected':''}>${ST[k]}</option>`).join('')}</select>
  <label>التاريخ</label><input type="date" name="d" value="${a.sdate||ymd()}"><label>ملاحظة (السعر أو السبب)</label><input name="n" value="${esc(a.snote)}">
  <div class="bar"><button class="btn">حفظ</button><button type="button" class="btn s" onclick="dt('${id}')">رجوع</button></div></form>`)}
function ss(e,id){e.preventDefault();const f=new FormData(e.target),a=by(id),s=f.get('s');
  const go2=()=>{a.status=s;a.sdate=s==='active'?'':f.get('d');a.snote=s==='active'?'':f.get('n');save();cl();render()};if(s==='sold'&&a.star){ask('⭐ هذا حيوان مميز للتربية. هل أنت متأكد أنك تريد تسجيله كمباع؟',go2);return false}go2();return false;
  }

/* تكاثر */
const opts=(L,none)=>(none?`<option value="">${none}</option>`:'')+L.map(a=>`<option value="${a.id}">${esc(a.name)} (${T[a.type][0]})</option>`).join('');
function mf(){const F=act().filter(a=>a.sex==='f'),M=act().filter(a=>a.sex==='m');
  if(!F.length){alert('أضف أنثى أولاً من تبويب الحيوانات.');return}
  sh(`<h3>تزاوج جديد</h3><form onsubmit="return sm(event)"><label>الأم</label><select name="m" required>${opts(F)}</select><label>الأب</label><select name="f">${opts(M,'غير معروف')}</select><label>تاريخ التزاوج</label><input type="date" name="d" value="${ymd()}" required>
  <div class="bar"><button class="btn">حفظ التزاوج</button><button type="button" class="btn s" onclick="cl()">إلغاء</button></div></form>`)}
function sm(e){e.preventDefault();const f=new FormData(e.target);db.matings.push({id:uid(),mother:f.get('m'),father:f.get('f'),date:f.get('d')});save();cl();render();return false}
function dm(id){ask('حذف سجل التزاوج؟',()=>{db.matings=db.matings.filter(m=>m.id!==id);save();render()})}
function bf(){const F=act().filter(a=>a.sex==='f'),M=act().filter(a=>a.sex==='m');
  if(!F.length){alert('أضف أنثى أولاً من تبويب الحيوانات.');return}
  sh(`<h3>تسجيل ولادة</h3><form onsubmit="return sb(event)"><label>الأم</label><select name="m" required>${opts(F)}</select><label>الأب</label><select name="f">${opts(M,'غير معروف')}</select>
  <label>تاريخ ولادة هذا الجيل</label><input type="date" name="d" value="${ymd()}" required>
  <div class="two"><div><label>عدد المواليد</label><input type="number" name="b" min="0" required></div><div><label>عدد الناجين</label><input type="number" name="s" min="0" required></div></div>
  <div class="bar"><button class="btn">حفظ الولادة</button><button type="button" class="btn s" onclick="cl()">إلغاء</button></div></form>`)}
function sb(e){e.preventDefault();const f=new FormData(e.target),n=+f.get('b'),v=+f.get('s'),id=uid(),m=f.get('m'),p=f.get('f'),d=f.get('d');if(v>n){note('عدد الناجين لا يمكن أن يزيد على عدد المواليد.');return false}db.births.push({id,mother:m,father:p,date:d,born:n,survived:v});save();render();note('تم حفظ الولادة ✅',`<button class="btn" style="width:100%;margin-bottom:8px" onclick="af('',{mother:'${m}',father:'${p}',litter:'${id}',birth:'${d}',type:'${by(m).type}',sex:'f'})">+ أضف مولوداً من هذا الجيل</button>`);return false}

/* تغذية */
function ff(){sh(`<h3>موعد إطعام</h3><form onsubmit="return sf2(event)"><label>لمن؟</label><select name="t"><option value="all">كل الحيوانات</option><option value="rabbit">🐇 الأرانب</option><option value="sheep">🐑 الأغنام</option></select>
  <label>الوقت</label><input type="time" name="h" value="07:00" required><label>نوع العلف</label><input name="f" required><label>الكمية</label><input name="q">
  <div class="bar"><button class="btn">حفظ</button><button type="button" class="btn s" onclick="cl()">إلغاء</button></div></form>`)}
function sf2(e){e.preventDefault();const f=new FormData(e.target);db.feeds.push({id:uid(),target:f.get('t'),time:f.get('h'),feed:f.get('f'),qty:f.get('q'),done:{}});save();cl();render();return false}
function df(id){ask('حذف الموعد؟',()=>{db.feeds=db.feeds.filter(x=>x.id!==id);save();render()})}
function tf(id){const f=db.feeds.find(x=>x.id===id),t=ymd();f.done=f.done||{};f.done[t]=!f.done[t];save();render()}

function po(s,cur){return '<option value="">غير معروف</option>'+db.animals.filter(x=>x.sex===s).map(x=>`<option value="${x.id}" ${cur===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}
function ef(id){const b=db.births.find(x=>x.id===id);
  sh(`<h3>الجيل ${ln(b)} · ${esc(nm(b.mother))}</h3><form onsubmit="return se(event,'${id}')"><label>👨 الأب</label><select name="f">${po('m',b.father)}</select><label>تاريخ الولادة</label><input type="date" name="d" value="${b.date}" required><div class="two"><div><label>وُلدوا</label><input type="number" name="b" min="0" value="${b.born}" required></div><div><label>أحياء (الباقين)</label><input type="number" name="s" min="0" value="${b.survived}" required></div></div><div class="bar"><button class="btn">حفظ</button><button type="button" class="btn s" onclick="cl()">إلغاء</button><button type="button" class="btn d" onclick="dbirth('${id}')">حذف</button></div></form>`)}
function dbirth(id){ask('حذف هذه الولادة؟',()=>{db.births=db.births.filter(x=>x.id!==id);save();render()})}
function se(e,id){e.preventDefault();const f=new FormData(e.target),b=db.births.find(x=>x.id===id),n=+f.get('b'),s=+f.get('s');if(s>n){note('عدد الأحياء لا يمكن أن يزيد على عدد المواليد.');return false}Object.assign(b,{father:f.get('f'),date:f.get('d'),born:n,survived:s});save();cl();render();return false}
/* نسخ احتياطي */
function ex(){sh(`<h3>نسخ البيانات</h3><p style="font-size:14px;color:var(--mut)">اضغط داخل المربع ثم انسخ كل النص واحفظه في ملاحظاتك.</p><textarea id="tx" rows="8" readonly onfocus="this.select()">${esc(JSON.stringify(db))}</textarea><div class="bar"><button class="btn" onclick="cp()">نسخ</button><button class="btn s" onclick="cl()">إغلاق</button></div>`)}
function cp(){const t=$('#tx');t.select();try{navigator.clipboard.writeText(t.value).then(()=>alert('تم النسخ'),()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}}
function im(){sh(`<h3>استرجاع البيانات</h3><p style="font-size:14px;color:var(--mut)">الصق النص المحفوظ. سيستبدل البيانات الحالية.</p><textarea id="tx" rows="8"></textarea><div class="bar"><button class="btn" onclick="ri()">استرجاع</button><button class="btn s" onclick="cl()">إلغاء</button></div>`)}
function ri(){try{const d=JSON.parse($('#tx').value);if(!Array.isArray(d.animals))throw 0;db=Object.assign({animals:[],matings:[],births:[],feeds:[]},d);save();cl();render()}catch(e){alert('النص غير صالح. تأكد أنك نسخته كاملاً.')}}

render();
setInterval(()=>{if(ymd()!==last){last=ymd();render()}},30000);
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
